name: 构建并部署博客

on:
  # 推送到 main 分支就自动构建发布
  push:
    branches: [main]
  # 也支持在 Actions 页面手动触发
  workflow_dispatch:

# 允许工作流向 GitHub Pages 发布
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署任务，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 用 Astro 构建
        uses: withastro/action@v3
        with:
          node-version: 22
          package-manager: npm

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
